# Reward Configuration
#
# This file has TWO sections:
#
#   groups:   pure reward DEFINITIONS ("what you get"). Groups never fire on
#             their own - they only run when a trigger (or another group)
#             references them by id.
#   triggers: the "WHEN + gating" entries. These are the only things evaluated
#             on each vote. Each trigger points at a 'reward' (a group id or a
#             raw console command) and says when/whether it fires.
#
# ---- groups ----
# A group runs in ONE of three modes (precedence: choices > permissioned > rewards):
#   rewards:      list of console commands or group references; ALL are executed.
#   choices:      weighted "pick one" table. Exactly ONE entry is chosen.
#                 Each entry has a 'weight' (relative) and a 'reward'.
#   permissioned: ordered "first authorized wins" list. The FIRST entry whose
#                 permission the player holds is chosen; a 'default' entry is the
#                 fallback. Branches are mutually exclusive.
#
# ---- triggers ----
# reward:      REQUIRED. A group id or a raw console command to run.
# when:        SINGLE (default), or an object with type + params (see below).
# permission:  optional permission required for this trigger to fire.
# max-claims:  optional cap on how many times this trigger pays out (omit = unlimited).
# chance:      optional percent [0-100] chance the trigger fires when eligible (default 100).
#              Rolled before a max-claim is consumed, so a failed roll doesn't use a claim.
#
# 'when' types:
#   SINGLE       - every vote
#   REPEATING    - every X votes            (interval)
#   STREAK       - when streak reaches X     (value)
#   STREAK_CYCLE - streak reaches start, then every interval after (start, interval)
#   TOTAL        - when total votes reaches X (value)
#   ALL_SITES    - votes on all configured sites in a single calendar day (once per day max)
#
# Placeholders in commands: %player%

groups:
  # ---- Daily vote reward (ported from FoPzlVote) ----
  # Premium players (ashvote.premium) roll the diamond-tier pool; everyone else
  # rolls the regular-tier pool. Branches are mutually exclusive; each then
  # weight-picks exactly one of its four tiers (standard 8 / enhanced 7 /
  # superior 4 / supreme 1).
  daily:
    permissioned:
      - ashvote.premium: daily-premium
      - default: daily-normal
  
  allsites:
    rewards:
      - "ncore msg %player% <gray>You voted on all sites today! You now have 24 hours of access to <yellow>Caravan Save Slot 2</yellow> and one <yellow>50% Caravan Exp Boost</yellow>!"
      - "lp user %player% permission settemp neorogue.slots.2 true 24h"
      - "nra boost VOTE 1 %player%"

  daily-premium:
    choices:
      - weight: 8
        reward: donator-standard
      - weight: 7
        reward: donator-enhanced
      - weight: 4
        reward: donator-superior
      - weight: 1
        reward: donator-supreme

  daily-normal:
    choices:
      - weight: 8
        reward: regular-standard
      - weight: 7
        reward: regular-enhanced
      - weight: 4
        reward: regular-superior
      - weight: 1
        reward: regular-supreme

  # Donator tiers - all commands in each tier are executed.
  donator-standard:
    rewards:
      - "ncore msg %player% <gray>You received the <yellow>Standard Donator </yellow>reward: <yellow>500 gold</yellow> and <yellow>10 exp"
      - "xp give %player% 10"
      - "execute at %player% run playsound entity.arrow.hit_player master %player%"
      - "eco give %player% 500"
      - "ashcoins give %player% 20"

  donator-enhanced:
    rewards:
      - "ncore msg %player% <gray>You received the <yellow>Enhanced Donator </yellow>reward: <yellow>700 gold</yellow> and <yellow>20 exp"
      - "xp give %player% 20"
      - "execute at %player% run playsound entity.firework_rocket.launch master %player%"
      - "eco give %player% 700"
      - "ashcoins give %player% 20"

  donator-superior:
    rewards:
      - "ncore msg %player% <gray>You received the <yellow>Superior Donator </yellow>reward: <yellow>1000 gold</yellow>, <yellow>50 exp</yellow>, and <yellow>Haste I (30m)"
      - "xp give %player% 50"
      - "execute at %player% run playsound entity.firework_rocket.launch master %player%"
      - "effect give %player% haste 1800 1"
      - "eco give %player% 1000"
      - "ashcoins give %player% 20"

  donator-supreme:
    rewards:
      - "ncore msg %player% <gray>You received the <yellow>Supreme Donator </yellow>reward: <yellow>1200 gold</yellow>, <yellow>100 exp</yellow>, <yellow>Speed I (30m)</yellow>, and <yellow>Haste II (30m)"
      - "xp give %player% 100"
      - "execute at %player% run playsound entity.firework_rocket.launch master %player%"
      - "effect give %player% haste 1800 1"
      - "effect give %player% speed 1800 0"
      - "eco give %player% 1200"
      - "ashcoins give %player% 30"

  # Regular tiers (default) - all commands in each tier are executed.
  regular-standard:
    rewards:
      - "ncore msg %player% <gray>You received the <yellow>Standard </yellow>reward: <yellow>250 gold</yellow> and <yellow>10 exp"
      - "xp give %player% 10"
      - "execute at %player% run playsound entity.arrow.hit_player master %player%"
      - "eco give %player% 200"
      - "ashcoins give %player% 10"

  regular-enhanced:
    rewards:
      - "ncore msg %player% <gray>You received the <yellow>Enhanced </yellow>reward: <yellow>450 gold</yellow> and <yellow>20 exp"
      - "xp give %player% 20"
      - "execute at %player% run playsound entity.firework_rocket.launch master %player%"
      - "eco give %player% 400"
      - "ashcoins give %player% 10"

  regular-superior:
    rewards:
      - "ncore msg %player% <gray>You received the <yellow>Superior </yellow>reward: <yellow>750 gold</yellow>, <yellow>50 exp</yellow>, and <yellow>Haste I (30m)"
      - "xp give %player% 50"
      - "execute at %player% run playsound entity.firework_rocket.launch master %player%"
      - "effect give %player% haste 1800 1"
      - "eco give %player% 600"
      - "ashcoins give %player% 10"

  regular-supreme:
    rewards:
      - "ncore msg %player% <gray>You received the <yellow>Supreme </yellow>reward: <yellow>1100 gold</yellow>, <yellow>100 exp</yellow>, <yellow>Speed I (30m)</yellow>, and <yellow>Haste II (30m)"
      - "xp give %player% 100"
      - "execute at %player% run playsound entity.firework_rocket.launch master %player%"
      - "effect give %player% haste 1800 1"
      - "effect give %player% speed 1800 0"
      - "eco give %player% 1000"
      - "ashcoins give %player% 15"

