# Reward Groups Configuration
# Each top-level key is a reward group name.
# rewards: list of console commands or group references (single word matching another group name)
#          ALL entries are executed.
# choices: weighted "pick one" table (alternative to rewards). Exactly ONE entry is chosen.
#          Each entry has a 'weight' (relative, need not sum to 100) and a 'reward'
#          (a console command or a group reference). If both 'rewards' and 'choices'
#          are set, 'choices' wins.
# trigger: SINGLE (default), or object with type + params
# permission: optional permission required to receive this reward
# max-claims: optional max times a player can receive this group (omit = unlimited)
# chance: optional percent [0-100] that the group fires when otherwise eligible (default 100).
#         Rolled before a max-claim is consumed, so a failed roll does not use up a claim.
#
# Placeholders in commands: %player%
#
# Trigger types:
#   SINGLE - every vote
#   REPEATING - every X votes (interval)
#   STREAK - when streak reaches X (value)
#   STREAK_CYCLE - when streak reaches start, then every interval after (start, interval)
#   TOTAL - when total votes reaches X (value)

vote-reward:
  rewards:
    - "give %player% diamond 1"

weekly-bonus:
  permission: "ashvote.weeklybonus"
  trigger:
    type: REPEATING
    interval: 7
  rewards:
    - "give %player% diamond_block 1"
    - rare-loot

streak-5:
  trigger:
    type: STREAK
    value: 5
  max-claims: 1
  rewards:
    - "broadcast %player% hit a 5-vote streak!"

streak-cycle-10:
  trigger:
    type: STREAK_CYCLE
    start: 10
    interval: 10
  rewards:
    - "give %player% netherite_ingot 1"

milestone-100:
  trigger:
    type: TOTAL
    value: 100
  max-claims: 1
  rewards:
    - "lp user %player% parent add voter100"

rare-loot:
  rewards:
    - "give %player% golden_apple 3"

# Weighted pick: exactly one of these fires each time the group runs.
# Weights are relative (40/30/20/10 behaves the same as 4/3/2/1).
random-loot:
  choices:
    - weight: 40
      reward: "give %player% diamond 1"
    - weight: 30
      reward: "give %player% emerald 1"
    - weight: 20
      reward: rare-loot                     # group reference works too
    - weight: 10
      reward: "give %player% netherite_ingot 1"

# Chance gate: 25% of votes this whole group fires; otherwise nothing happens.
lucky-drop:
  chance: 25
  rewards:
    - "give %player% diamond 1"
